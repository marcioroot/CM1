  <meta charset="UTF-8">

  <style>
    :root {
      --bg-color: #f7f9fa;
      --card-bg: #ffffff;
      --header-bg: #3a3b3c;
      --header-text: #ffffff;
      --text-color: #222222;
      --border-color: #d1d5db;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 24px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 1300px;
      background: var(--card-bg);
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 20px 24px;
    }

    .dictee-block {
      display: flex;
      flex-direction: column;
      break-inside: avoid;
    }

    .dictee-title {
      background-color: var(--header-bg);
      color: var(--header-text);
      font-weight: 700;
      font-size: 0.95rem;
      padding: 3px 10px;
      border-radius: 4px;
      display: inline-block;
      width: fit-content;
      margin-bottom: 8px;
      letter-spacing: 0.3px;
    }

    .word-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .word-item {
      display: flex;
      align-items: center;
      font-size: 0.95rem;
      cursor: pointer;
      user-select: none;
    }

    .word-item label {
      display: flex;
      align-items: center;
      cursor: pointer;
      width: 100%;
    }

    .word-item input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 13px;
      height: 13px;
      border: 1.2px solid #555;
      border-radius: 2px;
      margin-right: 8px;
      cursor: pointer;
      display: inline-grid;
      place-content: center;
      transition: all 0.15s ease-in-out;
      flex-shrink: 0;
    }

    .word-item input[type="checkbox"]:checked {
      background-color: #2b74e2;
      border-color: #2b74e2;
    }

    .word-item input[type="checkbox"]:checked::before {
      content: "";
      width: 4px;
      height: 7px;
      border: solid white;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
      margin-bottom: 2px;
    }

    .word-item input[type="checkbox"]:checked + span {
      color: #8c8c8c;
      text-decoration: line-through;
    }

    /* Adaptação para telas menores */
    @media (max-width: 1050px) {
      .container {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 700px) {
      .container {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 480px) {
      .container {
        grid-template-columns: 1fr;
      }
    }

    /* Otimizações para Impressão */
    @media print {
      body {
        padding: 0;
        background: transparent;
      }

      .container {
        box-shadow: none;
        padding: 10px;
        grid-template-columns: repeat(5, 1fr);
        gap: 10px 14px;
      }

      .dictee-title {
        background-color: #000 !important;
        color: #fff !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
        font-size: 0.85rem;
      }

      .word-item {
        font-size: 1rem;
      }

      .word-item input[type="checkbox"] {
        border-color: #000;
      }
    }
  </style>
</head>
